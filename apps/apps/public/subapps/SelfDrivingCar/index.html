<!-- boilerplate html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Self Driving Car - No libraries</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>

  <body>
    <canvas id="carCanvas"></canvas>
    <div id="verticalButtons">
      <button id="infoButton">ℹ️</button>
      <button id="restartButton">♻️</button>
      <button id="manualControl">🔑</button>
      <button id="saveBrain">💾</button>
      <button id="discardBrain">🗑️</button>
    </div>
    <canvas id="networkCanvas"></canvas>

    <div id="instructionModal" class="modal hidden">
      <div class="modal__content">
        <h2>How to drive</h2>
        <ul>
          <li>Arrow keys to steer when using KEYS control mode.</li>
          <li>AI cars learn from the best run; saving keeps the best brain.</li>
          <li>Use 🗑️ to clear a saved brain and restart learning.</li>
          <li>Click ℹ️ anytime to see these instructions again.</li>
        </ul>
        <button id="closeModal">Got it</button>
      </div>
    </div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
