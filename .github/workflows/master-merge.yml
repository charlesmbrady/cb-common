name: Build & Deploy Affected Apps

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy-affected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Get affected apps
        id: affected
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            BASE="HEAD~1"
          else
            BASE="origin/main"
          fi
          npx nx show projects --affected --type=app --base=$BASE --head=HEAD > affected_raw.txt || true
          ALLOWED_APPS="api-services charlesmbrady-web labs mockdat-web"
          grep -w -E "$(echo $ALLOWED_APPS | sed 's/ /|/g')" affected_raw.txt > affected.txt || true
          cat affected.txt
          APPS=$(cat affected.txt | paste -sd "," -)
          echo "apps=$APPS" >> $GITHUB_OUTPUT

      - name: Deploy affected apps
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1 # or your region
        run: |
          if [[ -z "${{ steps.affected.outputs.apps }}" ]]; then
            echo "No affected apps to deploy."
            exit 0
          fi

          # Define your app lists
          LAMBDA_APPS=("api-services")
          WEB_APPS=("charlesmbrady-web" "labs" "mockdat-web")

          # Map web apps to S3 buckets
          get_s3_bucket() {
            case "$1" in
              charlesmbrady-web) echo "charlesmbrady-test-website-content" ;;
              labs) echo "labs-test-website-content" ;;
              mockdat-web) echo "mockdat-test-website-content" ;;
              *) echo "" ;;
            esac
          }

          # Map web apps to type (default: next, override for mockdat-web)
          get_webapp_type() {
            case "$1" in
              mockdat-web) echo "react" ;;
              *) echo "next" ;;
            esac
          }

          # Map lambda Nx project to AWS Lambda function name
          get_lambda_name() {
            case "$1" in
              api-services) echo "charlesmbrady_Test_services_middleware" ;;
              *) echo "$1" ;;
            esac
          }

          IFS=',' read -ra APPS <<< "${{ steps.affected.outputs.apps }}"
          for APP in "${APPS[@]}"; do
            if [[ " ${LAMBDA_APPS[*]} " == *" $APP "* ]]; then
              LAMBDA_NAME=$(get_lambda_name "$APP")
              echo "Deploying Lambda: $APP as $LAMBDA_NAME"
              ./scripts/deploy_lambda.sh --lambda-name "$LAMBDA_NAME" --nx-project "$APP" --build --silent
            elif [[ " ${WEB_APPS[*]} " == *" $APP "* ]]; then
              S3_BUCKET=$(get_s3_bucket "$APP")
              APP_TYPE=$(get_webapp_type "$APP")
              if [[ -z "$S3_BUCKET" ]]; then
                echo "No S3 bucket mapping for $APP, skipping."
                continue
              fi
              echo "Deploying Web App: $APP to $S3_BUCKET (type: $APP_TYPE)"
              ./scripts/deploy_app.sh -s "$APP" "$S3_BUCKET" --type "$APP_TYPE"
            else
              echo "App $APP is not in Lambda or Web app lists, skipping."
            fi
          done
