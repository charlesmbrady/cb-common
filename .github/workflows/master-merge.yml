name: Deploy to development environment

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      affected_apps: ${{ steps.affected-apps.outputs.AFFECTED_APPS }}
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: false
          fetch-depth: 0

      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - uses: nrwl/nx-set-shas@v2
        with:
          main-branch-name: 'main'

      - name: Build all apps
        run: yarn nx run-many --target=build --all

      - name: Debug dist folder
        run: |
          ls -l dist || true
          ls -l dist/apps || true

      - name: Check if any apps changed
        id: check_dist_apps
        uses: andstor/file-existence-action@v1.1.0
        with:
          files: 'dist/apps'

      - name: Persist deployment bundle
        if: steps.check_dist_apps.outputs.files_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: ${{ github.workspace }}/dist/apps/

  deploy-charlesmbrady-web:
    needs: build
    if: contains(needs.build.outputs.affected_apps, 'charlesmbrady-web')
    uses: ./.github/workflows/s3_deploy_from_build.yml
    with:
      appName: 'charlesmbrady-web'
      bucketName: 'charlesmbrady-test-website-content'
      s3SyncOptions: '--delete'
      appType: 'react'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-mockdat-web:
    needs: build
    if: contains(needs.build.outputs.affected_apps, 'mockdat-web')
    uses: ./.github/workflows/s3_deploy_from_build.yml
    with:
      appName: 'mockdat-web'
      bucketName: 'mockdat-test-website-content'
      s3SyncOptions: '--delete'
      appType: 'react'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-labs:
    needs: build
    if: contains(needs.build.outputs.affected_apps, 'labs')
    uses: ./.github/workflows/s3_deploy_from_build.yml
    with:
      appName: 'labs'
      bucketName: 'labs-test-website-content'
      s3SyncOptions: '--delete'
      appType: 'react'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-api-services:
    needs: build
    if: contains(needs.build.outputs.affected_apps, 'api-services')
    uses: ./.github/workflows/lambda_deploy_from_build.yml
    with:
      appName: 'api-services'
      lambdaFunctionName: 'charlesmbrady_Test_services_middleware'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
