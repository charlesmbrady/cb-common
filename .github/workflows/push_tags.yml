name: Deploy to production environment (tag)

# When we push a tag, we want to build and deploy the app
on:
  push:
    tags:
      - 'charlesmbrady-web-*.*.*'
      - 'mockdat-web-*.*.*'
      - 'apps-*.*.*'
      - 'api-services-*.*.*'

jobs:
  set-app-name:
    runs-on: ubuntu-latest
    outputs:
      app_name: ${{ steps.set-app-name.outputs.APP_NAME }}
    steps:
      - name: Set app name from tag
        id: set-app-name
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          APP_NAME=$(echo "$TAG_NAME" | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+$//')
          echo "APP_NAME=$APP_NAME" >> $GITHUB_OUTPUT

  build:
    needs: set-app-name
    runs-on: ubuntu-latest
    outputs:
      app_name: ${{ needs.set-app-name.outputs.app_name }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install
      - name: Build app
        run: yarn nx run ${{ needs.set-app-name.outputs.app_name }}:build --configuration=production
      # No dependency installation needed; api-services bundles dependencies
      - name: Debug dist folder
        run: |
          ls -l dist || true
          ls -l dist/apps || true
      - name: Persist deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/apps

  deploy-charlesmbrady-web:
    needs: build
    if: needs.build.outputs.app_name == 'charlesmbrady-web'
    uses: ./.github/workflows/s3_deploy_from_build.yml
    with:
      appName: 'charlesmbrady-web'
      bucketName: 'charlesmbrady-production-website-content'
      s3SyncOptions: '--delete'
      appType: 'react'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-mockdat-web:
    needs: build
    if: needs.build.outputs.app_name == 'mockdat-web'
    uses: ./.github/workflows/s3_deploy_from_build.yml
    with:
      appName: 'mockdat-web'
      bucketName: 'mockdat-production-website-content'
      s3SyncOptions: '--delete'
      appType: 'react'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-apps:
    needs: build
    if: needs.build.outputs.app_name == 'apps'
    uses: ./.github/workflows/s3_deploy_from_build.yml
    with:
      appName: 'apps'
      bucketName: 'apps-production-website-content'
      s3SyncOptions: '--delete'
      appType: 'react'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-api-services:
    needs: build
    if: needs.build.outputs.app_name == 'api-services'
    uses: ./.github/workflows/lambda_deploy_from_build.yml
    with:
      appName: 'api-services'
      lambdaFunctionName: 'charlesmbrady_api_services_Production'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
