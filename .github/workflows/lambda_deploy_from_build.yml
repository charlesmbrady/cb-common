name: Deploy lambda to AWS

on:
  workflow_call:
    inputs:
      appName:
        required: true
        type: string
      lambdaFunctionName:
        required: true
        type: string
      env:
        required: false
        type: string
        default: 'test'
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  deploy-lambda:
    name: Deploy lambda to AWS
    runs-on: ubuntu-latest
    steps:
      - name: Echo
        run: echo app=${{ inputs.appName }} lambda=${{ inputs.lambdaFunctionName }} env=${{ inputs.env }}

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Set Nx base/head SHAs
        uses: nrwl/nx-set-shas@v2
        continue-on-error: true
        with:
          main-branch-name: 'main'

      - name: Debug SHAs (optional)
        run: |
          echo "NX_BASE=$NX_BASE"
          echo "NX_HEAD=$NX_HEAD"

      - name: Skip if app not affected
        id: check-affected
        run: |
          RAW=$(yarn -s nx show projects --affected --base="$NX_BASE" --head="$NX_HEAD" --type=app 2>/dev/null || echo "")
          if [ -z "$RAW" ]; then
            echo "Primary method returned empty; falling back to dry-run parse.";
            DRY=$(yarn -s nx affected --target=build --configuration=${{ inputs.env }} --dry-run 2>/dev/null || echo "")
            RAW=$(echo "$DRY" | awk -F: '/:build/ {print $1}' | sed 's/^[[:space:]]*//')
          fi
          echo "Affected projects (raw): $RAW"
          echo "$RAW" | tr ' ' '\n' | grep -x "${{ inputs.appName }}" >/dev/null && {
            echo "${{ inputs.appName }} is affected; continuing deploy.";
          } || {
            echo "${{ inputs.appName }} not affected; skipping deploy.";
            echo "SKIP_DEPLOY=true" >> $GITHUB_OUTPUT;
          }

      - name: Exit early when not affected
        if: steps.check-affected.outputs.SKIP_DEPLOY == 'true'
        run: |
          echo "No changes for ${{ inputs.appName }}; exiting." && exit 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy Lambda using script
        run: |
          ./scripts/deploy_lambda.sh --env "${{ inputs.env }}" --nx-project-name "${{ inputs.appName }}" --lambda-name "${{ inputs.lambdaFunctionName }}"
