name: Deploy lambda to AWS

on:
  workflow_call:
    inputs:
      appName:
        required: true
        type: string
      lambdaFunctionName:
        required: true
        type: string
      env:
        required: false
        type: string
        default: 'test'
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  deploy-lambda:
    name: Deploy lambda to AWS
    runs-on: ubuntu-latest
    steps:
      - name: Echo
        run: echo app=${{ inputs.appName }} lambda=${{ inputs.lambdaFunctionName }} env=${{ inputs.env }}

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Set Nx base/head SHAs
        uses: nrwl/nx-set-shas@v2
        with:
          main-branch-name: 'main'

      - name: Skip if app not affected
        id: check-affected
        run: |
          RAW_JSON=$(yarn -s nx show projects --affected --json 2>/dev/null || echo '{"projects":[]}')
          AFFECTED=$(echo "$RAW_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{let j=JSON.parse(d);console.log((j.projects||[]).join(' '));}catch(e){console.log('');}})")
          echo "Affected projects: $AFFECTED"
          echo "$AFFECTED" | tr ' ' '\n' | grep -x "${{ inputs.appName }}" >/dev/null || {
            echo "${{ inputs.appName }} not affected; skipping deploy.";
            echo "SKIP_DEPLOY=true" >> $GITHUB_OUTPUT;
          }

      - name: Exit early when not affected
        if: steps.check-affected.outputs.SKIP_DEPLOY == 'true'
        run: |
          echo "No changes for ${{ inputs.appName }}; exiting." && exit 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy Lambda using script
        run: |
          ./scripts/deploy_lambda.sh --env "${{ inputs.env }}" --nx-project-name "${{ inputs.appName }}" --lambda-name "${{ inputs.lambdaFunctionName }}"
