name: Deploy s3 app to AWS

on:
  workflow_call:
    inputs:
      appName:
        required: true
        type: string
      bucketName:
        required: true
        type: string
      s3SyncOptions:
        required: false
        type: string
        default: ''
      appType:
        required: false
        type: string
        default: 'next'
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  deploy-s3:
    name: Deploy s3 app to AWS
    runs-on: ubuntu-latest
    steps:
      - name: Echo
        run: echo ${{ inputs.appName }} ${{ inputs.bucketName }} ${{ inputs.appType }}

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Retrieve deployment bundle
        uses: actions/download-artifact@v4
        with:
          name: build

      - name: Debug
        run: pwd && ls -R .

      - name: Debug root and scripts directory
        run: |
          ls -l
          ls -l scripts || true

      - name: Upload artifacts to AWS S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          echo "Syncing build/${{ inputs.appName }}/ to s3://${{ inputs.bucketName }}/"
          aws s3 sync "build/${{ inputs.appName }}/" "s3://${{ inputs.bucketName }}/" ${{ inputs.s3SyncOptions }}
