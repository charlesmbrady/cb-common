name: Deploy on Release

# Trigger when a release is published (created by semver:github)
on:
  release:
    types: [published]

jobs:
  set-app-name:
    runs-on: ubuntu-latest
    outputs:
      app_name: ${{ steps.set-app-name.outputs.APP_NAME }}
    steps:
      - name: Set app name from release tag
        id: set-app-name
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          APP_NAME=$(echo "$TAG_NAME" | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+$//')
          echo "APP_NAME=$APP_NAME" >> $GITHUB_OUTPUT
          echo "Deploying app: $APP_NAME"

  build:
    needs: set-app-name
    runs-on: ubuntu-latest
    outputs:
      app_name: ${{ needs.set-app-name.outputs.app_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile || yarn install
      - name: Build app (production)
        run: yarn nx run ${{ needs.set-app-name.outputs.app_name }}:build --configuration=production
      - name: Debug dist folder
        run: |
          ls -l dist || true
          ls -l dist/apps || true
          ls -l dist/apps/${{ needs.set-app-name.outputs.app_name }} || true
      - name: Persist deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/apps

  deploy-s3:
    name: Deploy S3 apps
    needs: build
    strategy:
      matrix:
        include:
          - name: 'charlesmbrady-web'
            bucket: 'charlesmbrady-production-website-content'
            appType: 'react'
            cloudfrontId: ''
          - name: 'mockdat-web'
            bucket: 'mockdat-production-website-content'
            appType: 'react'
            cloudfrontId: ''
          - name: 'apps'
            bucket: 'apps-production-website-content'
            appType: 'react'
            cloudfrontId: ''
    if: contains('charlesmbrady-web,mockdat-web,apps', needs.build.outputs.app_name)
    uses: ./.github/workflows/s3_deploy_from_build.yml
    with:
      appName: ${{ matrix.name }}
      bucketName: ${{ matrix.bucket }}
      s3SyncOptions: '--delete'
      appType: ${{ matrix.appType }}
      cloudfrontId: ${{ matrix.cloudfrontId }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-lambda:
    name: Deploy Lambda apps
    needs: build
    strategy:
      matrix:
        include:
          - name: 'api-services'
            lambdaFunctionName: 'charlesmbrady_api_services_Production'
    if: needs.build.outputs.app_name == 'api-services'
    uses: ./.github/workflows/lambda_deploy_from_build.yml
    with:
      appName: ${{ matrix.name }}
      lambdaFunctionName: ${{ matrix.lambdaFunctionName }}
      env: 'production'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
