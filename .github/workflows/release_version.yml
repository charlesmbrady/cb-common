name: Deploy on Release

# Trigger when a release is published (created by semver:github)
on:
  release:
    types: [published]

jobs:
  set-app-name:
    runs-on: ubuntu-latest
    outputs:
      app_name: ${{ steps.set-app-name.outputs.APP_NAME }}
    steps:
      - name: Set app name from release tag
        id: set-app-name
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          APP_NAME=$(echo "$TAG_NAME" | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+$//')
          echo "APP_NAME=$APP_NAME" >> $GITHUB_OUTPUT
          echo "Deploying app: $APP_NAME"

  deploy-charlesmbrady-web:
    needs: set-app-name
    if: needs.set-app-name.outputs.app_name == 'charlesmbrady-web'
    uses: ./.github/workflows/s3_deploy_from_build.yml
    with:
      appName: 'charlesmbrady-web'
      bucketName: 'charlesmbrady-production-website-content'
      s3SyncOptions: '--delete'
      appType: 'react'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-mockdat-web:
    needs: set-app-name
    if: needs.set-app-name.outputs.app_name == 'mockdat-web'
    uses: ./.github/workflows/s3_deploy_from_build.yml
    with:
      appName: 'mockdat-web'
      bucketName: 'mockdat-production-website-content'
      s3SyncOptions: '--delete'
      appType: 'react'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-apps:
    needs: set-app-name
    if: needs.set-app-name.outputs.app_name == 'apps'
    uses: ./.github/workflows/s3_deploy_from_build.yml
    with:
      appName: 'apps'
      bucketName: 'apps-production-website-content'
      s3SyncOptions: '--delete'
      appType: 'react'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-api-services:
    needs: set-app-name
    if: needs.set-app-name.outputs.app_name == 'api-services'
    uses: ./.github/workflows/lambda_deploy_from_build.yml
    with:
      appName: 'api-services'
      lambdaFunctionName: 'charlesmbrady_api_services_Production'
      env: 'production'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
